services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - SHADOW_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}_shadow
      - PLAYER_TOKEN_SECRET=${PLAYER_TOKEN_SECRET}
      - CORS_ORIGIN=http://localhost
      - BACKEND_PORT=4000
      # Deploy provenance, injected by cd.yml through the shell environment.
      # backend/src/app.ts reports these on /api/health and frontend/components/
      # Footer.tsx renders the version, and both treat the literal 'unknown' as a
      # sentinel meaning "not injected" — so the default must stay that literal
      # rather than becoming an empty string, which would read as a version.
      - APP_VERSION=${APP_VERSION:-unknown}
      - GIT_SHA=${GIT_SHA:-unknown}
    volumes:
      - ./scripts:/scripts:ro
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* is inlined by `next build`, so it has to be a build arg,
      # not a runtime environment entry: setting it under `environment:` would
      # change nothing about the already-baked bundle. Defaults to the same
      # 'unknown' sentinel the backend uses, which the Footer renders unprefixed.
      args:
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-unknown}
    ports:
      - '3000:3000'
    environment:
      - BACKEND_URL=http://backend:4000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
