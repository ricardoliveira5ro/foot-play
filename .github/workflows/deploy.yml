name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      run_frontend_lint:
        description: 'Run frontend lint'
        required: false
        default: true
        type: boolean
      run_backend_lint:
        description: 'Run backend lint'
        required: false
        default: true
        type: boolean
      run_backend_build:
        description: 'Backend build (type check)'
        required: false
        default: true
        type: boolean
      run_tests_sonar:
        description: 'Run tests with coverage and the Sonar scan'
        required: false
        default: true
        type: boolean
      run_deploy:
        description: 'Deploy to Oracle Cloud (main only)'
        required: false
        default: true
        type: boolean
      run_seed:
        description: 'Seed the database after deploying (main only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    if: ${{ inputs.run_frontend_lint }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    if: ${{ inputs.run_backend_lint }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint backend
        run: ESLINT_USE_FLAT_CONFIG=false npx eslint backend/src/

  backend-build:
    name: Backend Build (Type Check)
    runs-on: ubuntu-latest
    if: ${{ inputs.run_backend_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          SHADOW_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy_shadow"

      - name: Build backend (type check)
        working-directory: backend
        run: npm run build

  backend-test:
    name: Tests, Coverage & Sonar Scan
    runs-on: ubuntu-latest
    if: ${{ inputs.run_tests_sonar }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          SHADOW_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy_shadow"

      - name: Run tests with coverage gate
        working-directory: backend
        run: npm run test:coverage
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          SHADOW_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy_shadow"

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          SHADOW_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy_shadow"

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          SHADOW_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy_shadow"

  validate-deploy-ref:
    name: Validate Deploy Branch
    runs-on: ubuntu-latest
    if: ${{ inputs.run_deploy && github.ref != 'refs/heads/main' }}
    steps:
      - name: Fail with clear message
        run: |
          echo "::error::Deploy and Seed only run on the main branch. Re-run the workflow with branch 'main' selected."
          exit 1

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: [frontend-lint, backend-lint, backend-build, backend-test]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      inputs.run_deploy &&
      needs.frontend-lint.result != 'failure' &&
      needs.backend-lint.result != 'failure' &&
      needs.backend-build.result != 'failure' &&
      needs.backend-test.result != 'failure'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          timeout: "30m"
          script: |
            cd ~/foot-play
            git pull origin main
            sudo docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
            sudo docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend npx prisma migrate deploy
            sleep 10
            curl -f http://localhost/api/health || exit 1

      - name: Seed database
        if: ${{ inputs.run_seed }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          timeout: "30m"
          script: |
            cd ~/foot-play
            sudo docker run --rm -v ~/foot-play/scripts:/app -v ~/foot-play/tsconfig.base.json:/tsconfig.base.json:ro -w /app node:20-alpine sh -c "npm install && npx ts-node --transpile-only src/download-data.ts"
            sudo docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend npx ts-node --transpile-only --project prisma/tsconfig.json prisma/seed.ts
